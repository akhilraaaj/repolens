services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - repolens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Optional chat and embedding settings, read at run time. .dockerignore keeps
    # this file out of the image. DATABASE_URL below still wins.
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://repolens:repolens@postgres:5432/repolens
      FASTEMBED_CACHE_PATH: /srv/models
    # Lets the API reach an Ollama running on the host as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - repolens-models:/srv/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - repolens-ollama:/root/.ollama

volumes:
  repolens-postgres:
  repolens-models:
  repolens-ollama:
